<div class="services-container">
  <h2>Nossos servicos</h2>
  <p class="intro">Solucoes completas para tirar seu produto digital do papel e manter evolucao continua.</p>
  <div class="cards-grid">
    @for (service of services; track service.title) {
      <mat-card class="service-card">
        <mat-card-header>
            <div mat-card-avatar class="service-icon">
                <mat-icon>{{service.icon}}</mat-icon>
            </div>
            <mat-card-title>{{service.title}}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{service.description}}</p>
        </mat-card-content>
        <mat-card-actions>
            <button mat-button color="primary">Saiba mais</button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</div>
